<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover: die App darf bis unter die "Notch" reichen -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1c1c1e" media="(prefers-color-scheme: dark)">
  <!-- Diese Zeilen machen die Seite auf dem iPhone-Homescreen zur "App" -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Kalender">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <title>Unser Kalender</title>
  <!-- type="module" erlaubt import/export zwischen unseren JS-Dateien -->
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-row">
      <h1 id="title"></h1>
      <button id="btn-prev" class="icon-btn" aria-label="Zurück">‹</button>
      <button id="btn-today" class="text-btn">Heute</button>
      <button id="btn-next" class="icon-btn" aria-label="Weiter">›</button>
      <button id="btn-settings" class="icon-btn" aria-label="Einstellungen">⚙︎</button>
    </div>
    <div class="segmented">
      <button data-mode="month">Monat</button>
      <button data-mode="week">Woche</button>
    </div>
    <nav id="filter-bar" class="filter-bar" aria-label="Filter"></nav>
  </header>

  <main id="calendar"></main>

  <button id="btn-add" class="fab" aria-label="Neuer Termin">+</button>

  <!-- Termin anlegen / bearbeiten. <dialog> ist ein eingebautes Pop-up-Element. -->
  <dialog id="event-dialog" class="sheet">
    <form id="event-form" novalidate>
      <div class="sheet-header">
        <button type="button" class="text-btn" data-close>Abbrechen</button>
        <!-- autofocus + tabindex: Fokus landet beim Öffnen hier statt im Textfeld (keine Tastatur) -->
        <h2 id="event-dialog-title" tabindex="-1" autofocus>Neuer Termin</h2>
        <button type="submit" class="text-btn strong">Sichern</button>
      </div>
      <div class="sheet-body">
        <div class="group">
          <label class="field"><input name="title" placeholder="Titel" maxlength="100" autocomplete="off" class="left"></label>
          <label class="field chevron"><span>Kategorie</span><select name="categoryId"></select></label>
        </div>
        <div class="group">
          <label class="field"><span>Datum</span><input type="date" name="date"></label>
          <label class="field"><span>Ganztägig</span><input type="checkbox" name="allDay" class="switch"></label>
          <div class="time-fields">
            <label class="field"><span>Beginn</span><input type="time" name="start" step="300"></label>
            <label class="field"><span>Ende</span><input type="time" name="end" step="300"></label>
          </div>
        </div>
        <div class="group">
          <label class="field"><span>Wöchentlich</span><input type="checkbox" name="repeatWeekly" class="switch"></label>
          <label class="field repeat-until"><span>Bis einschl.</span><input type="date" name="repeatUntil"></label>
        </div>
        <p class="hint" id="series-hint" hidden>Änderungen gelten für die ganze Serie.</p>
        <div class="group">
          <label class="field stack"><textarea name="note" rows="3" placeholder="Notiz"></textarea></label>
        </div>
        <p class="form-error" id="event-error" role="alert"></p>
        <button type="button" id="btn-delete" class="danger-btn">Termin löschen</button>
      </div>
    </form>
  </dialog>

  <!-- Kategorien und gespeicherte Ansichten -->
  <dialog id="settings-dialog" class="sheet">
    <div class="sheet-header">
      <span></span>
      <h2 tabindex="-1" autofocus>Einstellungen</h2>
      <button type="button" class="text-btn strong" data-close>Fertig</button>
    </div>
    <div class="sheet-body">
      <h3>Kategorien</h3>
      <ul id="category-list" class="edit-list"></ul>
      <p class="hint below">Der Schalter blendet eine Kategorie im Kalender ein oder aus.</p>
      <form id="category-add" class="inline-form">
        <input type="color" name="color" value="#14b8a6" aria-label="Farbe">
        <input name="name" placeholder="Neue Kategorie" maxlength="30" required class="left">
        <button class="text-btn strong">Hinzufügen</button>
      </form>

      <h3>Gespeicherte Ansichten</h3>
      <ul id="view-list" class="edit-list"></ul>
      <form id="view-add" class="inline-form">
        <input name="name" placeholder="Name, z. B. Studium" maxlength="30" required class="left">
        <button class="text-btn strong">Speichern</button>
      </form>
      <p class="hint below">Speichert die gerade eingeschalteten Kategorien als Ansicht. Sie erscheint dann oben als Schnellauswahl.</p>
    </div>
  </dialog>
</body>
</html>
